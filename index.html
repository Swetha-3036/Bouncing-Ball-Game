<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bouncing Ball - Retro Game</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="game-container">

    <!-- ================= MAIN MENU ================= -->

    <div id="menuScreen">

        <h1>BOUNCING BALL</h1>

        <p>CLASSIC RETRO GAME</p>

        <div class="menu-ball">●</div>

        <button id="playButton">
            PLAY GAME
        </button>

        <h3>
            HIGH SCORE:
            <span id="menuHighScore">0</span>
        </h3>

    </div>


    <!-- ================= GAME SCREEN ================= -->

    <div id="gameScreen" class="hidden">

        <div class="top-bar">

            <div>
                SCORE
                <b id="score">0</b>
            </div>

            <div>
                LEVEL
                <b id="level">1</b>
            </div>

            <div>
                LIVES
                <b id="lives">❤️❤️❤️</b>
            </div>

            <div>
                COINS
                <b id="coins">0</b>
            </div>

            <button id="pauseButton">
                PAUSE
            </button>

        </div>


        <canvas
            id="gameCanvas"
            width="800"
            height="500">
        </canvas>


        <div class="controls">

            <button id="leftButton">
                ◀
            </button>

            <button id="rightButton">
                ▶
            </button>

        </div>


        <p class="help">
            ← → / A D to move | P to pause
        </p>

    </div>


    <!-- ================= PAUSE ================= -->

    <div id="pauseScreen"
         class="hidden pause">

        <h1>PAUSED</h1>

        <button id="resumeButton">
            RESUME
        </button>

        <button id="restartPauseButton">
            RESTART
        </button>

        <button id="menuPauseButton">
            MAIN MENU
        </button>

    </div>


    <!-- ================= GAME OVER ================= -->

    <div id="gameOverScreen"
         class="hidden">

        <h1>GAME OVER</h1>

        <div class="game-over-ball">
            ●
        </div>

        <h2>
            SCORE:
            <span id="finalScore">0</span>
        </h2>

        <h2>
            HIGH SCORE:
            <span id="finalHighScore">0</span>
        </h2>

        <h2>
            COINS:
            <span id="finalCoins">0</span>
        </h2>

        <button id="playAgainButton">
            PLAY AGAIN
        </button>

        <button id="mainMenuButton">
            MAIN MENU
        </button>

    </div>

</div>


<script src="js/game.js"></script>

</body>

</html>
